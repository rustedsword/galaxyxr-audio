Syntax 4

SectionUseCase."HiFi" {
	File "/Samsung/galaxy-xr/HiFi.conf"
	Comment "HiFi quality Music."
}

# The amplifiers play through their protection firmware (DSP_TX1) at the
# gains Samsung's tuning is made for: 13 dB analog, 0 dB digital (409).
# The firmware hears its amplifier's slot of the TDM frame and the
# monitors that Samsung's mixer paths give it.
BootSequence [
	cset "name='WooferL DSP_RX1 Source' ASP_RX1"
	cset "name='WooferL DSP_RX2 Source' ASP_RX1"
	cset "name='WooferL DSP_RX5 Source' VDD_BATTMON"
	cset "name='WooferL DSP_RX6 Source' VDD_BSTMON"
	cset "name='WooferL DSP_RX7 Source' CLASSH_TGT"
	cset "name='WooferL DSP_RX8 Source' VDD_BATTMON"
	cset "name='WooferL DACPCM Source' DSP_TX1"
	cset "name='WooferL Analog PCM Volume' 1"
	cset "name='WooferL Digital PCM Volume' 409"
	cset "name='WooferR DSP_RX1 Source' ASP_RX1"
	cset "name='WooferR DSP_RX2 Source' ASP_RX1"
	cset "name='WooferR DSP_RX5 Source' VDD_BATTMON"
	cset "name='WooferR DSP_RX6 Source' VDD_BSTMON"
	cset "name='WooferR DSP_RX7 Source' CLASSH_TGT"
	cset "name='WooferR DSP_RX8 Source' VDD_BATTMON"
	cset "name='WooferR DACPCM Source' DSP_TX1"
	cset "name='WooferR Analog PCM Volume' 1"
	cset "name='WooferR Digital PCM Volume' 409"
	cset "name='TweeterL DSP_RX1 Source' ASP_RX1"
	cset "name='TweeterL DSP_RX2 Source' ASP_RX1"
	cset "name='TweeterL DSP_RX5 Source' VDD_BATTMON"
	cset "name='TweeterL DSP_RX6 Source' VDD_BSTMON"
	cset "name='TweeterL DSP_RX7 Source' CLASSH_TGT"
	cset "name='TweeterL DSP_RX8 Source' VDD_BATTMON"
	cset "name='TweeterL DACPCM Source' DSP_TX1"
	cset "name='TweeterL Analog PCM Volume' 1"
	cset "name='TweeterL Digital PCM Volume' 409"
	cset "name='TweeterR DSP_RX1 Source' ASP_RX1"
	cset "name='TweeterR DSP_RX2 Source' ASP_RX1"
	cset "name='TweeterR DSP_RX5 Source' VDD_BATTMON"
	cset "name='TweeterR DSP_RX6 Source' VDD_BSTMON"
	cset "name='TweeterR DSP_RX7 Source' CLASSH_TGT"
	cset "name='TweeterR DSP_RX8 Source' VDD_BATTMON"
	cset "name='TweeterR DACPCM Source' DSP_TX1"
	cset "name='TweeterR Analog PCM Volume' 1"
	cset "name='TweeterR Digital PCM Volume' 409"
]

