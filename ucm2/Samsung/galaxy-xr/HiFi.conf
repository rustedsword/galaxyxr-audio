SectionVerb {
	EnableSequence [
		cset "name='QUATERNARY_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia2' 1"
		cset "name='MultiMedia3 Mixer VA_CODEC_DMA_TX_0' 1"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	# Whatever alsactl restored, the speakers play through the protection
	# firmware at the gains its tuning is made for
	EnableSequence [
		cset "name='WooferL DACPCM Source' DSP_TX1"
		cset "name='WooferR DACPCM Source' DSP_TX1"
		cset "name='TweeterL DACPCM Source' DSP_TX1"
		cset "name='TweeterR DACPCM Source' DSP_TX1"
		cset "name='WooferL Analog PCM Volume' 1"
		cset "name='WooferR Analog PCM Volume' 1"
		cset "name='TweeterL Analog PCM Volume' 1"
		cset "name='TweeterR Analog PCM Volume' 1"
		cset "name='WooferL Digital PCM Volume' 409"
		cset "name='WooferR Digital PCM Volume' 409"
		cset "name='TweeterL Digital PCM Volume' 409"
		cset "name='TweeterR Digital PCM Volume' 409"
		cset "name='WooferL AMP Enable Switch' 1"
		cset "name='WooferR AMP Enable Switch' 1"
		cset "name='TweeterL AMP Enable Switch' 1"
		cset "name='TweeterR AMP Enable Switch' 1"
	]

	DisableSequence [
		cset "name='WooferL AMP Enable Switch' 0"
		cset "name='WooferR AMP Enable Switch' 0"
		cset "name='TweeterL AMP Enable Switch' 0"
		cset "name='TweeterR AMP Enable Switch' 0"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."DisplayPort" {
	Comment "DisplayPort"

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
		JackControl "DP0 Jack"
	}
}

SectionDevice."Mic" {
	Comment "Microphones"

	EnableSequence [
		cset "name='VA DMIC MUX0' DMIC0"
		cset "name='VA DMIC MUX1' DMIC1"
		cset "name='VA DEC0 MUX' VA_DMIC"
		cset "name='VA DEC1 MUX' VA_DMIC"
		cset "name='VA_AIF1_CAP Mixer DEC0' 1"
		cset "name='VA_AIF1_CAP Mixer DEC1' 1"
		cset "name='VA_DEC0 Volume' 100"
		cset "name='VA_DEC1 Volume' 100"
	]

	DisableSequence [
		cset "name='VA_AIF1_CAP Mixer DEC0' 0"
		cset "name='VA_AIF1_CAP Mixer DEC1' 0"
		cset "name='VA DMIC MUX0' ZERO"
		cset "name='VA DMIC MUX1' ZERO"
	]

	Value {
		CaptureChannels 2
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
	}
}
